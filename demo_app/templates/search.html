
    <!DOCTYPE html>
    <html>
    <head>
        <title>Member Search</title>
        <style>
            body { font-family: Arial; margin: 20px; background: #f0f0f0; }
            table { border-collapse: collapse; width: 100%; background: white; }
            td { border: 1px solid #ccc; padding: 10px; }
            .header { background: #003366; color: white; font-weight: bold; }
            input { padding: 5px; width: 200px; }
            button { padding: 5px 15px; background: #003366; color: white; border: none; cursor: pointer; }
            .error { color: red; font-weight: bold; }
        </style>
    </head>
    <body>
        <table>
            <tr class="header">
                <td colspan="2">MEMBER SEARCH</td>
            </tr>
            <tr>
                <td colspan="2">
                    {% if error %}
                    <div class="error">{{ error }}</div>
                    {% endif %}
                    <form action="/member/search" method="get" onsubmit="return searchMember(event)">
                        <table>
                            <tr>
                                <td>Member ID:</td>
                                <td><input type="text" name="member_id" id="member_id" role="textbox" aria-label="Member ID"></td>
                            </tr>
                            <tr>
                                <td colspan="2">
                                    <button type="submit" role="button" aria-label="Search Member">Search</button>
                                </td>
                            </tr>
                        </table>
                    </form>
                </td>
            </tr>
        </table>
        
        <script>
            function searchMember(event) {
                event.preventDefault();
                const memberId = document.getElementById('member_id').value;
                if (memberId) {
                    window.location.href = '/member/' + memberId;
                }
                return false;
            }
        </script>
    </body>
    </html>
